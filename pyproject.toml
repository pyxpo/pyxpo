[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo"
dynamic = ["version"]
description = "Python-first mobile app framework with React-style components and native widgets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["mobile", "android", "ios", "react-native", "expo", "python", "ui", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo"
Issues = "https://github.com/pyxpo/pyxpo/issues"

[project.scripts]
pyxpo = "pyxpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo.__version__" }

[tool.setuptools.package-data]
pyxpo = ["templates/**/*", "_native/**/*", "build/runtime_manifest.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

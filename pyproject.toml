[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo"
version = "0.1.0"
description = "Python-first mobile app framework with React-style components and native widgets"
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pyxpo = "pyxpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyxpo = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

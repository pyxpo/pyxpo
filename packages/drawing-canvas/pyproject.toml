[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-drawing-canvas"
dynamic = ["version"]
description = "A finger and pen drawing canvas with undo, redo and PNG export for pyxpo apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a3,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/drawing-canvas"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
drawing-canvas = "pyxpo_drawing_canvas"

[tool.setuptools]
packages = ["pyxpo_drawing_canvas"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_drawing_canvas.__version__" }

[tool.setuptools.package-data]
pyxpo_drawing_canvas = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*", "web.js"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]

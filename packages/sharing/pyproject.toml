[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-sharing"
dynamic = ["version"]
description = "System share sheet for pyxpo apps (react-native Share shape)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0"]

[project.urls]
Homepage = "https://github.com/ivishalchaubey/pyxpo/tree/main/packages/sharing"
Issues = "https://github.com/ivishalchaubey/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
sharing = "pyxpo_sharing"

[tool.setuptools]
packages = ["pyxpo_sharing"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_sharing.__version__" }

[tool.setuptools.package-data]
pyxpo_sharing = ["pyxpo-module.json", "ios/**/*", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]

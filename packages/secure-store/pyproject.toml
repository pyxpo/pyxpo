[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-secure-store"
dynamic = ["version"]
description = "Encrypted key-value storage for pyxpo apps: iOS Keychain and Android Keystore (expo-secure-store shape)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0,<0.2"]

[project.urls]
Homepage = "https://github.com/ivishalchaubey/pyxpo/tree/main/packages/secure-store"
Issues = "https://github.com/ivishalchaubey/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
secure-store = "pyxpo_secure_store"

[tool.setuptools]
packages = ["pyxpo_secure_store"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_secure_store.__version__" }

[tool.setuptools.package-data]
pyxpo_secure_store = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]

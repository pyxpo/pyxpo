[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-translate"
dynamic = ["version"]
description = "Offline text translation for pyxpo apps: Google ML Kit's on-device models (about 30 MB per language, downloaded once when the app asks), then every translation runs on the phone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "translate", "translation", "offline", "on-device", "ml-kit", "hindi", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a6,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/translate"
Documentation = "https://github.com/pyxpo/pyxpo/blob/main/packages/translate/README.md"
Changelog = "https://github.com/pyxpo/pyxpo/blob/main/packages/translate/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo/tree/main/packages/translate"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
translate = "pyxpo_translate"

[tool.setuptools]
packages = ["pyxpo_translate"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_translate.__version__" }

[tool.setuptools.package-data]
pyxpo_translate = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]

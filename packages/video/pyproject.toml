[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-video"
dynamic = ["version"]
description = "Plays a video file or URL inside pyxpo apps: AVPlayer on iOS and Mac, VideoView on Android, <video> on the web."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "video", "player", "media", "mp4", "avplayer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a3,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/video"
Documentation = "https://github.com/pyxpo/pyxpo/blob/main/packages/video/README.md"
Changelog = "https://github.com/pyxpo/pyxpo/blob/main/packages/video/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo/tree/main/packages/video"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
video = "pyxpo_video"

[tool.setuptools]
packages = ["pyxpo_video"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_video.__version__" }

[tool.setuptools.package-data]
pyxpo_video = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*", "web.js"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]

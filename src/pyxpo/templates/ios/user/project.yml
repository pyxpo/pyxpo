# Xcode project spec for xcodegen. This file is yours: edit it freely (it is never overwritten by `pyxpo build`).
# App name, bundle id, version and signing team come from [tool.pyxpo] through pyxpo-gen/Pyxpo.xcconfig.
name: PyxpoApp
include:
  - path: pyxpo-gen/modules.project.yml  # Swift packages of linked native modules (generated)
options:
  bundleIdPrefix: dev.pyxpo
  createIntermediateGroups: true
configFiles:
  Debug: pyxpo-gen/Pyxpo.xcconfig
  Release: pyxpo-gen/Pyxpo.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_OBJC_BRIDGING_HEADER: App/Pyxpo-Bridging-Header.h
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  configs:
    # The runtime (layout, view updates) runs every frame; unoptimized it makes dev builds lag on a phone.
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
targets:
  PyxpoApp:
    type: application
    platform: iOS
    settings:
      base:
        # Values below come from [tool.pyxpo] (supports_tablet, ...) through pyxpo-gen/Pyxpo.xcconfig.
        # Target-level presets beat the xcconfig, so these point at its variables.
        INFOPLIST_FILE: $(PYXPO_INFOPLIST)
        TARGETED_DEVICE_FAMILY: $(PYXPO_DEVICE_FAMILY)
    sources:
      - path: App
        excludes:
          - Info.plist  # the built plist is pyxpo-gen/Info.plist (this file + [tool.pyxpo])
      - path: pyxpo-gen/runtime
      - path: pyxpo-gen/native
    dependencies:
      - framework: pyxpo-gen/Python.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      # Building in Xcode (or plain xcodebuild) stages the Python app first, like `pyxpo build ios`.
      # PYXPO_PYTHON (Pyxpo.xcconfig) is the interpreter that ran `pyxpo prebuild`; `pyxpo build` stages itself.
      - script: |
          [ -n "$PYXPO_STAGED" ] && exit 0
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          KIND=device; [ "$PLATFORM_NAME" = iphonesimulator ] && KIND=simulator; [ "$PLATFORM_NAME" = macosx ] && KIND=catalyst
          REL=; [ "$CONFIGURATION" = Release ] && REL=--release
          "${PYXPO_PYTHON:-python3}" -m pyxpo stage ios --dir "$PROJECT_DIR/.." --kind "$KIND" $REL
        name: Stage Python app
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - script: bash "$PROJECT_DIR/pyxpo-gen/scripts/install_python.sh"
        name: Install Python
        basedOnDependencyAnalysis: false

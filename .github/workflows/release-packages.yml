# Release ONE native module package from packages/ to PyPI, independently of core pyxpo.
# Trigger: push a tag pkg/<name>/v<version>, for example pkg/image-picker/v0.1.0 (version must match
# packages/<name>/pyxpo_<name>/__init__.py). Each PyPI project (pyxpo-image-picker, ...) needs its own
# Trusted Publisher entry pointing at this workflow and the `pypi` environment.
name: release-packages
on:
  push:
    tags: ["pkg/*/v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh tools/dev_install.sh
        env:
          PYTHON: python
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: build and check the tagged package (wheel + sdist carry pyxpo-module.json, Swift, Kotlin, entry point)
        run: python tools/build_packages.py --tag "${GITHUB_REF_NAME}" --outdir wheelhouse/
      - run: twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
